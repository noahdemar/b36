<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B-36 Flight Deck</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8aa4c0; font-family: system-ui, sans-serif; }
      #hud { position: fixed; left: 12px; top: 10px; color: #f2f0e8; font: 13px/1.5 ui-monospace, monospace; white-space: pre; text-shadow: 0 1px 2px #000; pointer-events: none; }
      #help { position: fixed; right: 12px; top: 10px; color: #eee; background: rgba(10, 12, 14, 0.72); padding: 10px 12px; border-radius: 6px; font-size: 12px; pointer-events: none; }
      #help td { padding: 1px 8px 1px 0; vertical-align: top; }
      #help td:first-child { color: #ffd27a; white-space: nowrap; }
      #label { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); color: #fff; font-size: 13px; background: rgba(0, 0, 0, 0.55); padding: 4px 10px; border-radius: 4px; pointer-events: none; }
      #label:empty { display: none; }
      #yoke { position: fixed; width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 2px solid #ffd27a; border-radius: 50%; pointer-events: none; display: none; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font-size: 15px; pointer-events: none; }
      #sight { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 1; }
  #sight .h, #sight .v { position: absolute; background: rgba(255, 210, 120, 0.85); }
  #sight .h { left: 30%; right: 30%; top: 50%; height: 1px; }
  #sight .v { top: 25%; bottom: 25%; left: 50%; width: 1px; }
  #sight .ring { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -31px 0 0 -31px; border: 1px solid rgba(255, 210, 120, 0.85); border-radius: 50%; }
  #impact { position: fixed; left: 50%; top: calc(50% + 60px); transform: translateX(-50%); color: #ffd27a; font: 12px ui-monospace, monospace; display: none; pointer-events: none; text-shadow: 0 1px 2px #000; }
</style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="help"></div>
    <div id="label"></div>
    <div id="yoke"></div>
<div id="sight"><div class="h"></div><div class="v"></div><div class="ring"></div></div>
<div id="impact"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
